<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="description" content="CREZI">
  <title>CREZI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23df2929'/%3E%3C/svg%3E" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="site-refresh.css">
  <link rel="stylesheet" href="ui-fixes.css">
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="#home" aria-label="CREZI home">CREZI<span>.</span></a>
    <nav class="desktop-nav" aria-label="Main navigation" data-i18n-aria="mainNavigation">
      <a href="#home" data-i18n="home">Home</a>
      <a href="#discography" data-i18n="discography">Music</a>
      <a href="#about" data-i18n="about">About</a>
      <a href="#contact" data-i18n="contact">Contact</a>
    </nav>
    <div class="header-actions">
      <div class="language-wrap">
        <label class="visually-hidden" for="languageSelect" data-i18n="chooseLanguage">Choose language</label>
        <select id="languageSelect" aria-label="Choose language">
          <option value="en">English</option>
          <option value="nl">Nederlands</option>
          <option value="fr">Français</option>
          <option value="sq">Shqip</option>
          <option value="de">Deutsch</option>
        </select>
      </div>
      <button class="icon-button" id="themeToggle" type="button" aria-label="Switch theme" aria-pressed="false">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
      <button class="icon-button menu-toggle" id="menuToggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobileMenu"><span class="burger" aria-hidden="true"></span></button>
    </div>
  </header>
  <nav class="mobile-menu" id="mobileMenu" aria-label="Main navigation" data-i18n-aria="mainNavigation" hidden>
    <a href="#home" data-i18n="home">Home</a>
    <a href="#discography" data-i18n="discography">Music</a>
    <a href="#about" data-i18n="about">About</a>
    <a href="#contact" data-i18n="contact">Contact</a>
  </nav>
  <main id="main">
    <section class="hero section-shell" id="home">
      <div class="hero-copy"><h1>CREZI</h1><p data-i18n="tagline">Independent Albanian producer and artist.</p></div>
      <button class="hero-portrait image-colour-toggle" type="button" aria-label="Show portrait in colour" data-i18n-aria="portraitColour" aria-pressed="false"><img src="https://raw.githubusercontent.com/itsscrezi/crezi.portfolio/main/crezi-portrait.png" alt="CREZI portrait"></button>
    </section>
    <div class="marquee-wrap" aria-label="Independent Albanian music producer and artist">
      <div class="marquee-track" aria-hidden="true">
        <span>INDEPENDENT ALBANIAN MUSIC PRODUCER AND ARTIST</span>
      </div>
    </div>
    <section class="section-shell section-block" id="discography">
      <div class="section-heading"><h2 data-i18n="discography">Music</h2></div>
      <div class="music-grid" id="musicGrid"></div>
    </section>
    <section class="about-section section-shell section-block" id="about">
      <div class="about-heading"><h2 data-i18n="about">About</h2><p data-about-story></p></div>
      <div class="photo-carousel" aria-label="CREZI photos" data-i18n-aria="photoGallery">
        <div class="carousel-viewport" id="carouselViewport"></div>
        <div class="carousel-controls">
          <button type="button" id="photoPrevious" aria-label="Previous photo" data-i18n-aria="previousPhoto"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
          <span id="photoCount" aria-live="polite">01 / 01</span>
          <button type="button" id="photoNext" aria-label="Next photo" data-i18n-aria="nextPhoto"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
        </div>
      </div>
    </section>
    <section class="social-section" aria-label="Social media" data-i18n-aria="socialMedia">
      <div class="section-shell social-inner">
        <a href="https://www.instagram.com/itsscrezi/" target="_blank" rel="noopener noreferrer" aria-label="Instagram" data-i18n-aria="instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle class="icon-fill" cx="18" cy="6" r="1"></circle></svg></a>
        <a href="https://www.tiktok.com/@itsscrezi" target="_blank" rel="noopener noreferrer" aria-label="TikTok" data-i18n-aria="tiktok"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3v11.2a4.2 4.2 0 1 1-3.6-4.15v3.2a1.2 1.2 0 1 0 .6 1.04V3h3c.2 2.3 1.45 3.65 3.7 4v3.1A8 8 0 0 1 14 8.5"></path></svg></a>
        <a href="https://www.youtube.com/@itsscrezi" target="_blank" rel="noopener noreferrer" aria-label="YouTube" data-i18n-aria="youtube"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="4"></rect><path class="icon-fill" d="m10 9 5 3-5 3z"></path></svg></a>
        <a href="https://open.spotify.com/artist/3qm3DDhWwc61SOjXkeu8eL" target="_blank" rel="noopener noreferrer" aria-label="Spotify" data-i18n-aria="spotify"><svg viewBox="0 0 24 24" aria-hidden="true"><circle class="spotify-circle" cx="12" cy="12" r="10"></circle><path class="spotify-mark" d="M6.5 9c4.2-1.1 8.5-.6 11.5 1.2M7.2 12c3.4-.8 7-.35 9.7 1.15M8 15c2.8-.55 5.4-.2 7.7.95"></path></svg></a>
      </div>
    </section>
    <section class="section-shell contact-section section-block" id="contact">
      <div class="section-heading"><h2 data-i18n="contact">Contact</h2></div>
      <form class="contact-form" id="contactForm">
        <div class="form-row">
          <label><span data-i18n="name">Name</span><input name="name" required autocomplete="name" placeholder="Name" data-i18n-placeholder="name"></label>
          <label><span data-i18n="email">Email</span><input name="email" type="email" required autocomplete="email" placeholder="name@example.com"></label>
        </div>
        <div class="form-row">
          <label><span data-i18n="topic">Topic</span><select name="topic" required>
            <option value="Question" data-i18n="question">Question</option>
            <option value="Beat request" data-i18n="beatRequest">Beat request</option>
            <option value="Collaboration" data-i18n="collaboration">Collaboration</option>
            <option value="Business inquiry" data-i18n="business">Business inquiry</option>
            <option value="Other" data-i18n="other">Other</option>
          </select></label>
          <span class="form-spacer" aria-hidden="true"></span>
        </div>
        <label><span data-i18n="message">Message</span><textarea name="message" rows="5" required placeholder="Message" data-i18n-placeholder="message"></textarea></label>
        <input type="hidden" name="_subject" value="CREZI website enquiry"><input type="hidden" name="_template" value="table">
        <div class="form-bottom"><p id="formStatus" role="status" aria-live="polite" data-i18n="formNote">Send your message directly to CREZI.</p><button class="button" type="submit" id="submitButton" data-i18n="send">Send</button></div>
      </form>
      <a class="contact-email" href="mailto:itsscrezi@gmail.com">itsscrezi@gmail.com</a>
    </section>
  </main>
  <footer class="site-footer"><div class="section-shell footer-inner"><span>© <span id="year"></span> CREZI</span><a href="#home"><span data-i18n="backTop">Back to top</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></a></div></footer>
  <script src="content.js"></script>
  <script src="script.js"></script>
  <script>document.title='CREZI';new MutationObserver(()=>{if(document.title!=='CREZI')document.title='CREZI'}).observe(document.querySelector('title'),{childList:true,characterData:true,subtree:true});if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));</script>
</body>
</html>
