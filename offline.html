<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="robots" content="noindex">
  <title>Offline — CREZI</title>
  <script>try{var th=localStorage.getItem('crezi-theme');if(th)document.documentElement.dataset.theme=th;}catch(e){}</script>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/site-refresh.css">
  <link rel="stylesheet" href="/ui-fixes.css">
  <style>
    .offline-page{min-height:100svh;display:grid;grid-template-rows:auto 1fr auto}
    .offline-main{width:min(760px,calc(100% - 40px));margin:auto;padding:80px 0}
    .offline-main h1{margin:0 0 20px;font:700 clamp(3rem,12vw,8rem)/.9 "Space Grotesk",Arial,sans-serif;letter-spacing:-.1em;text-transform:uppercase}
    .offline-main p{max-width:460px;color:var(--muted)}
    .offline-main .button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .page-tag{justify-self:end;color:var(--muted);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase}
  </style>
</head>
<body class="offline-page">
  <header class="site-header"><a class="wordmark" href="/">CREZI<span>.</span></a><span></span><span class="page-tag" data-t="tag">Offline</span></header>
  <main class="offline-main">
    <h1 data-t="title">No connection.</h1>
    <p data-t="text">You appear to be offline. Check your connection, then try again.</p>
    <button class="button" type="button" onclick="location.reload()"><span data-t="button">Try again</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"></path></svg></button>
  </main>
  <footer class="site-footer"><div class="section-shell footer-inner"><span>© CREZI</span><a href="mailto:itsscrezi@gmail.com">itsscrezi@gmail.com</a></div></footer>
  <script>
    var L = {
      en:{tag:'Offline',title:'No connection.',text:'You appear to be offline. Check your connection, then try again.',button:'Try again'},
      nl:{tag:'Offline',title:'Geen verbinding.',text:'Je lijkt offline te zijn. Controleer je verbinding en probeer het opnieuw.',button:'Opnieuw proberen'},
      fr:{tag:'Hors ligne',title:'Pas de connexion.',text:'Vous semblez être hors ligne. Vérifiez votre connexion puis réessayez.',button:'Réessayer'},
      sq:{tag:'Pa internet',title:'Pa lidhje.',text:'Duket se je pa internet. Kontrollo lidhjen dhe provo përsëri.',button:'Provo përsëri'},
      de:{tag:'Offline',title:'Keine Verbindung.',text:'Du scheinst offline zu sein. Prüfe deine Verbindung und versuche es erneut.',button:'Erneut versuchen'}
    };
    var lang = 'en';
    try { lang = localStorage.getItem('crezi-language') || 'en'; } catch (e) {}
    if (!L[lang]) lang = 'en';
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach(function (n) { n.textContent = L[lang][n.getAttribute('data-t')]; });
    addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
